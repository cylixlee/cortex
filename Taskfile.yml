version: 3

tasks:
  go:
    desc: Start Go server
    cmd: go run ./cmd/api
    interactive: true
    silent: true

  vue:
    desc: Start Vue server
    dir: "{{.ROOT_DIR}}/web"
    cmd: pnpm dev
    interactive: true
    silent: true

  build:
    desc: Build both Go and Vue project to perform static analysis
    cmds:
      - go build ./...
      - cd web && pnpm build
    silent: true
